# ==========================================================
# Container image publish to GHCR (Phase B).
# ==========================================================
#
# One image serves BOTH the api and worker services — same code, the compose
# service picks the command (see backend/Dockerfile and docker-compose.yml).
#
# Deliberately a SEPARATE workflow from ci.yml, gated on CI succeeding: a
# published image that never passed the tests is worse than no image, because
# the tag implies it did. `workflow_run` is what enforces that ordering.
#
# Tagging strategy, which is also the rollback story: every build is tagged with
# the immutable commit SHA, and `latest` is moved on top of it. Rolling back is
# then re-deploying an explicit sha tag rather than hoping a rebuild reproduces
# the previous state. See DEPLOYMENT.md.

name: Publish image

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Only publish when the CI run that triggered this actually passed.
    # workflow_run fires on failure too, so without this a red build would ship.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the exact commit CI validated, not whatever main points
          # at now — they differ if another push landed in the meantime.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve image name
        # GHCR rejects uppercase in image paths and this repository's owner has
        # capitals, so ${{ github.repository }} cannot be used raw.
        id: img
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Resolve commit SHA
        id: sha
        run: echo "value=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Automatically provided; no secret to manage.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ steps.sha.outputs.value }}
            ${{ steps.img.outputs.name }}:latest
          # The torch/transformers layer is multi-GB and identical across
          # code-only changes; without a cache every push re-downloads it.
          cache-from: type=gha
          cache-to: type=gha,mode=max
